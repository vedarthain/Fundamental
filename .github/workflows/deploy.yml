# Cloud build & artifact deploy to DigitalOcean Web Droplet
name: Deploy to DigitalOcean Web Droplet

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        run: |
          cd web
          npm ci

      - name: Generate version metadata
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1 | tr -d '"\n')
          cat <<EOF > web/public/version.json
          {
            "commit": "${{ github.sha }}",
            "commitShort": "${GITHUB_SHA:0:7}",
            "commitMessage": "$COMMIT_MSG",
            "branch": "${{ github.ref_name }}",
            "builtAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "runId": "${{ github.run_id }}",
            "runNumber": "${{ github.run_number }}"
          }
          EOF

      - name: Compile Next.js in Cloud
        env:
          APP_DB_URL: "postgresql://dummy:dummy@localhost:5432/app"
          GOLDEN_DB_URL: "postgresql://dummy:dummy@localhost:5432/golden"
          SESSION_SECRET: "dummy_session_secret_for_build_only_123456"
        run: |
          cd web
          npm run build

      - name: Package .next artifact
        run: |
          tar -czf next-build.tar.gz --exclude='.next/cache' --exclude='.next/dev' -C web .next public/version.json

      - name: Upload build archive to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: 'next-build.tar.gz'
          target: '/tmp'
          overwrite: true

      - name: Unpack build and Restart PM2
        uses: appleboy/ssh-action@v1.0.3
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          envs: UPSTOX_ANALYTICS_TOKEN,REVALIDATE_TOKEN
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main
            cd web

            # Sync Upstox Analytics Token into .env files
            if [ -n "$UPSTOX_ANALYTICS_TOKEN" ]; then
              touch .env.production
              if grep -q "^UPSTOX_ANALYTICS_TOKEN=" .env.production; then
                sed -i "s|^UPSTOX_ANALYTICS_TOKEN=.*|UPSTOX_ANALYTICS_TOKEN=$UPSTOX_ANALYTICS_TOKEN|" .env.production
              else
                echo "UPSTOX_ANALYTICS_TOKEN=$UPSTOX_ANALYTICS_TOKEN" >> .env.production
              fi
              for env_file in .env.local .env; do
                if [ -f "$env_file" ]; then
                  if grep -q "^UPSTOX_ANALYTICS_TOKEN=" "$env_file"; then
                    sed -i "s|^UPSTOX_ANALYTICS_TOKEN=.*|UPSTOX_ANALYTICS_TOKEN=$UPSTOX_ANALYTICS_TOKEN|" "$env_file"
                  else
                    echo "UPSTOX_ANALYTICS_TOKEN=$UPSTOX_ANALYTICS_TOKEN" >> "$env_file"
                  fi
                fi
              done
            fi

            # Install any new runtime production dependencies
            npm install --omit=dev --no-audit --prefer-offline

            # Locate and extract cloud-compiled Next.js build
            ARCHIVE=$(find /tmp -name "next-build.tar.gz" -print -quit)
            if [ -n "$ARCHIVE" ] && [ -f "$ARCHIVE" ]; then
              echo "Extracting $ARCHIVE..."
              rm -rf .next
              tar -xzf "$ARCHIVE" -C .
              rm -f "$ARCHIVE"
            else
              echo "Error: Build archive not found in /tmp"
              exit 1
            fi

            # Reload Next.js with zero downtime / fast PM2 reload
            pm2 restart equityroots --update-env

            # Ensure PM2 log rotation is active (10MB max size, 7 retained files, gzip compression)
            if ! pm2 list | grep -q "pm2-logrotate"; then
              echo "Installing and configuring pm2-logrotate..."
              pm2 install pm2-logrotate || true
              pm2 set pm2-logrotate:max_size 10M || true
              pm2 set pm2-logrotate:retain 7 || true
              pm2 set pm2-logrotate:compress true || true
              pm2 save || true
            fi

            # Allow 5s for PM2 to boot, then warm up / refresh price cache
            sleep 5
            curl -s -X POST "http://localhost:3000/api/cron/intraday-equity?token=$REVALIDATE_TOKEN&force=1" || true
