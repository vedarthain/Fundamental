# Weekly safety-net scan for UNANNOUNCED splits/bonuses.
# Runs on the Droplet via SSH.

name: Detect unannounced corporate actions

on:
  schedule:
    # Sundays 05:00 UTC = 10:30 IST
    - cron: '0 5 * * 0'
  workflow_dispatch: {}

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run Detection on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main

            python3 -m pip install -q 'psycopg[binary]==3.2.*' 2>/dev/null || pip install -q 'psycopg[binary]==3.2.*' || true

            if [ -f web/.env.production ]; then
              set -a
              eval "$(grep -E '^(APP_DB_URL|GOLDEN_DB_URL)=' web/.env.production)"
              set +a
            fi

            export PYTHONUNBUFFERED=1
            python3 scripts/apply-corp-adjustments.py --detect-only --dry-run --since-days 30
