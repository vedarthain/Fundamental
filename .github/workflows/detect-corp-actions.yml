# Weekly safety-net scan for UNANNOUNCED splits/bonuses.
# Runs on the Droplet via SSH with direct VPC access to Postgres.

name: Detect unannounced corporate actions

on:
  schedule:
    # Sundays 05:00 UTC = 10:30 IST
    - cron: '0 5 * * 0'
  workflow_dispatch: {}

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run Detection on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main

            for env_path in web/.env.production web/.env.local web/.env .env.production .env.local .env; do
              if [ -f "$env_path" ] && grep -q "APP_DB_URL" "$env_path"; then
                set -a
                # shellcheck disable=SC1090
                . "$env_path"
                set +a
                break
              fi
            done

            export PYTHONUNBUFFERED=1
            /var/www/Fundamental/.venv/bin/python scripts/apply-corp-adjustments.py --detect-only --dry-run --since-days 30
