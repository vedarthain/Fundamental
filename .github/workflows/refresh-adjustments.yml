# Corporate-action adjustment (adj_close recompute)
# Runs on the Droplet via SSH following Refresh LTP + OHLC or manual dispatch.

name: Apply corp-action adjustments

on:
  workflow_run:
    workflows: ["Refresh LTP + OHLC"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  adjust:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 20
    steps:
      - name: Run Adjustment on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main

            for env_path in web/.env.production web/.env.local web/.env .env.production .env.local .env; do
              if [ -f "$env_path" ] && grep -q "APP_DB_URL" "$env_path"; then
                set -a
                # shellcheck disable=SC1090
                . "$env_path"
                set +a
                break
              fi
            done

            export PYTHONUNBUFFERED=1
            /var/www/Fundamental/.venv/bin/python scripts/apply-corp-adjustments.py --apply-only --changed-only
