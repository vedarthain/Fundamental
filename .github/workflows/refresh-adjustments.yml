# Corporate-action adjustment (adj_close recompute)
# Runs on the Droplet via SSH following Refresh LTP + OHLC or manual dispatch.

name: Apply corp-action adjustments

on:
  workflow_run:
    workflows: ["Refresh LTP + OHLC"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  adjust:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 20
    steps:
      - name: Run Adjustment on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main

            python3 -m pip install -q 'psycopg[binary]==3.2.*' 2>/dev/null || pip install -q 'psycopg[binary]==3.2.*' || true

            if [ -f web/.env.production ]; then
              set -a
              eval "$(grep -E '^(APP_DB_URL|GOLDEN_DB_URL)=' web/.env.production)"
              set +a
            fi

            export PYTHONUNBUFFERED=1
            python3 scripts/apply-corp-adjustments.py --apply-only --changed-only
