# Corporate announcements refresh — per-stock exchange filings from BSE.
# Runs on the Droplet via SSH with direct VPC access to Postgres.

name: Refresh announcements

on:
  schedule:
    - cron: '0 22 * * 0'   # Sun 22:00 UTC = Mon 03:30 IST
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Run BSE Announcements Sweep on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main

            python3 -m pip install -q 'psycopg[binary]==3.2.*' 2>/dev/null || pip install -q 'psycopg[binary]==3.2.*' || true

            if [ -f web/.env.production ]; then
              set -a
              eval "$(grep -E '^(APP_DB_URL|GOLDEN_DB_URL)=' web/.env.production)"
              set +a
            fi

            export PYTHONUNBUFFERED=1
            python3 scripts/fetch-announcements.py --max-minutes 92
