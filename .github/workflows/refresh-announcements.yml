# Corporate announcements refresh — per-stock exchange filings from BSE.
# Runs on the Droplet via SSH with direct VPC access to Postgres.

name: Refresh announcements

on:
  schedule:
    - cron: '0 22 * * 0'   # Sun 22:00 UTC = Mon 03:30 IST
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Run BSE Announcements Sweep on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main

            for env_path in web/.env.production web/.env.local web/.env .env.production .env.local .env; do
              if [ -f "$env_path" ] && grep -q "APP_DB_URL" "$env_path"; then
                set -a
                # shellcheck disable=SC1090
                . "$env_path"
                set +a
                break
              fi
            done

            export PYTHONUNBUFFERED=1
            /var/www/Fundamental/.venv/bin/python scripts/fetch-announcements.py --max-minutes 92
