# Monthly refresh of the per-company descriptive fields in app.universe:
# business_summary / website / employees, and ceo_name / ceo_title /
# key_officers. Primary source for both is yfinance's Ticker.info; business
# summaries additionally fall back to Screener where yfinance has nothing.
#
# WHY THIS WORKFLOW EXISTS
#
# It didn't, and that was the bug. `fetch-business-info` and `fetch-officers`
# have been CLI commands since May but no workflow ever called them, so they
# ran exactly once by hand and never again:
#
#     field           populated  blank  distinct fetch days
#     business_info      2150      443          1   (2026-05-04)
#     officers           2150      443          1   (2026-05-05)
#
# One distinct timestamp across the whole table, 141 days old at the time of
# writing, and every symbol onboarded after that date landing permanently
# blank. CLAUDE.md §5, exactly: seeded once, nothing maintains it. Meanwhile
# sync-universe-monthly kept adding symbols, so the blank count only grew.
#
# WHY IT COULD NOT SIMPLY BE SCHEDULED AS-IS
#
# The old fetch path swallowed its own yfinance exception, returned an empty
# info dict, then wrote business_summary = NULL and stamped fetched_at = now().
# Under the --refresh flag a periodic job needs, one yfinance outage would have
# erased good prose across the universe and marked it fresh, while exiting 0.
# business_info.py's docstring has the full account. The module now refuses to
# write on a failed fetch and COALESCEs rather than nulls; that fix is a
# prerequisite for this file, not a companion to it.
#
# WHY MONTHLY, 90 DAYS, AND A BATCH LIMIT
#
# 90 is the staleness threshold: a row is re-fetched once its
# business_info_fetched_at / officers_fetched_at passes 90 days. It is a
# judgement, not a measurement — nobody has counted how often an NSE ticker's
# filed description or CEO actually changes. It was set at 180 first, on the
# reasoning that these are once-in-years events, and moved to 90 on the
# opposite reasoning, which is the one that holds: a stale CEO is a WRONG fact
# on the stock page, not a missing one, and yfinance calls are free. The cost
# of being twice as fresh is nil; the cost of being six months wrong about a
# CEO is a reader trusting the wrong name.
#
# At 90 days the entire universe is overdue right now (the May load is 141 days
# old), so the backlog is 2,593 rather than the 451 blanks alone.
#
# The limit is about runtime and about clumping. A full 2,593-symbol pass at
# 1.5s throttle plus call time runs over two hours; two of them back to back
# crowds the Actions 6h cap. And because the May load stamped every row
# identically, an unbounded age-based refresh would re-stamp them identically
# again and they would all fall due on the same day forever. Draining 700
# oldest-first per month spreads the timestamps and keeps them spread. At 700
# a month the 2,593-row backlog clears in four runs, after which each run picks
# up only what has genuinely aged past 90 days.
#
# THE SCREENER FALLBACK
#
# 448 active symbols get nothing from yfinance and never will — Yahoo has no
# profile for them. Screener does, tested 12/12 against those blanks. But a
# Screener blurb is ~100 characters against yfinance's ~1,500, so it is a
# fallback only: tried when yfinance SUCCEEDED and returned nothing, never when
# yfinance failed. Every row records which source it came from in
# business_summary_source (migration 0073) so nothing downstream has to infer
# it from length. See etl/src/fundamental_etl/screener/profile.py.
#
# WHAT MAKES IT FAIL
#
# --require-progress. The job re-queries the blank/stale count before and after
# the run and exits 1 if it selected symbols and the count did not fall. It is
# not "is everything fresh" — with a batch limit that is legitimately false for
# months, and a check that is always red gets ignored. It catches the failures
# that would otherwise be silent: yfinance returning nothing for every symbol,
# a write path that no-ops, the wrong database.
#
# Required secrets (all already configured for weekly-fetch / shareholding —
# no new setup):
#   NEON_APP_URL        — Postgres URL for fundamental_app on Neon
#   NEON_GOLDEN_URL     — Postgres URL for golden_db. Not read by this job, but
#                         Settings (config.py) requires it at import time, so
#                         the CLI will not start without it.
#   SCREENER_SESSIONID  — Screener auth cookie, for the fallback only. If it has
#   SCREENER_CSRFTOKEN    expired the fallback degrades to "no summary found"
#                         rather than failing the run; the blanks stay blank and
#                         the yfinance side is unaffected.

name: Refresh company info

on:
  # 5th of every month, 06:00 UTC = 11:30 IST. Off-market, and a day clear of
  # the shareholding refresh on the 3rd so two long scrapes never overlap.
  schedule:
    - cron: '0 6 5 * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max symbols per command (oldest-fetched first)'
        required: false
        default: '700'

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 700 symbols x ~3s (1.5s throttle + call) is ~35 min per command, ~70 min
    # for both. 180 leaves room for yfinance retries without approaching the
    # 6h hard cap.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fundamental-etl
        run: pip install -e ./etl

      # Sequential, not parallel: both commands hit the same yfinance endpoint
      # for the same tickers, and running them concurrently doubles the request
      # rate against a service that rate-limits by returning an empty dict —
      # which now costs us a skipped write rather than a wipe, but still wastes
      # the run.
      - name: Refresh business summaries
        env:
          APP_DB_URL:    ${{ secrets.NEON_APP_URL }}
          # The ETL refuses a remote APP_DB_URL by default (etl/src/fundamental_etl/db.py) so a local run cannot drift onto prod. CI writes to prod on purpose, so it says so out loud.
          FUNDAMENTAL_ALLOW_REMOTE_DB: "1"
          GOLDEN_DB_URL: ${{ secrets.NEON_GOLDEN_URL }}
          # Needed only by --screener-fallback, for the ~448 symbols yfinance
          # has no profile for.
          SCREENER_SESSIONID: ${{ secrets.SCREENER_SESSIONID }}
          SCREENER_CSRFTOKEN: ${{ secrets.SCREENER_CSRFTOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m fundamental_etl.cli fetch-business-info \
            --max-age-days 90 \
            --limit "${{ github.event.inputs.limit || 700 }}" \
            --screener-fallback \
            --require-progress

      - name: Refresh officers
        env:
          APP_DB_URL:    ${{ secrets.NEON_APP_URL }}
          FUNDAMENTAL_ALLOW_REMOTE_DB: "1"
          GOLDEN_DB_URL: ${{ secrets.NEON_GOLDEN_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m fundamental_etl.cli fetch-officers \
            --max-age-days 90 \
            --limit "${{ github.event.inputs.limit || 700 }}" \
            --require-progress

      # De-duped alert. A silent failure here is how the fields froze for 141
      # days in the first place, so the failure has to be visible somewhere
      # other than a run log nobody opens.
      - name: Raise a loud alert on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 Company info refresh FAILED"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf '%s\n' \
            "The monthly company-info refresh did not complete cleanly at $(date -u '+%Y-%m-%d %H:%M UTC')." \
            "" \
            "Status: ${{ job.status }}." \
            "" \
            "Run log: $RUN_URL" \
            "" \
            "If it failed on --require-progress, the run selected symbols but left the blank/stale count unchanged — check whether yfinance returned an empty dict for every ticker (rate limiting) rather than assuming the write path broke." \
            "" \
            "Nothing is lost by a failed run: a failed fetch writes nothing and a successful one never nulls a field it did not receive. Re-running resumes from the oldest rows.")
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Appended to existing alert issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY"
            echo "Opened a new alert issue"
          fi
