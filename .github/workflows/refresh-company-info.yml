# Monthly refresh of per-company descriptive fields in app.universe:
# business_summary / website / employees, and ceo_name / ceo_title.
# Runs on the Droplet via SSH with direct VPC access to Postgres.

name: Refresh company info

on:
  schedule:
    - cron: '0 6 5 * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max symbols per command (oldest-fetched first)'
        required: false
        default: '700'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Run Company Info Refresh on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main

            /var/www/Fundamental/.venv/bin/pip install -q 'psycopg[binary]==3.2.*' yfinance
            /var/www/Fundamental/.venv/bin/pip install -q -e ./etl

            for env_path in web/.env.production web/.env.local web/.env .env.production .env.local .env; do
              if [ -f "$env_path" ] && grep -q "APP_DB_URL" "$env_path"; then
                set -a
                # shellcheck disable=SC1090
                . "$env_path"
                set +a
                break
              fi
            done

            export FUNDAMENTAL_ALLOW_REMOTE_DB="1"
            export PYTHONUNBUFFERED=1

            LIMIT="${{ github.event.inputs.limit || '700' }}"
            /var/www/Fundamental/.venv/bin/python -m fundamental_etl.cli fetch-business-info --limit "$LIMIT" --refresh --require-progress || true
            /var/www/Fundamental/.venv/bin/python -m fundamental_etl.cli fetch-officers --limit "$LIMIT" --refresh --require-progress || true
