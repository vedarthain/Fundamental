# Company-overview worker — fills app.company_overview from Screener's Key
# Points, 23 symbols a run.
#
# DAILY, plus manual dispatch from the Actions tab.
#
# WHY IT EXISTS
#
# Measured on production 2026-09-24: 178 of 2,591 active symbols had an
# overview row. The other 2,413 render an empty panel. Every other ingest in
# this repo is on a cron; this one had been run by hand, twice, alphabetically
# — which is why the stored rows are almost all symbols starting A, B or C.
#
# WHY 23 (WAS 80, THEN 100, BRIEFLY 26)
#
# Not a throttle we chose. Screener's Key Points endpoint enforces a hard quota
# and past it returns HTTP 200 with a ~400-byte stub instead of the fragment.
#
# The quota CHANGED SHAPE, measured 2026-10-06. It used to be a DAILY cap —
# "We allow 80 key-insights per day", resetting at midnight. It is now a
# ROLLING 30-DAY cap: "Paid users can access 800 key-insights within the last
# 30 days." 800/30 = 26.67 units a day.
#
# BUT THE PROBES SPEND THE SAME BUDGET, which is why this is 23 and not 26.
# Every Key Points request counts, including the ones we make to ask whether
# Key Points still works:
#
#   freshness-check.yml   2/day (cron '30 */12 * * *')  = 60 per 30 days
#   this job's pre-flight session probe   1/run         = 30 per 30 days
#
# That is 90 units of the 800 spent on observation, leaving 710, or 23.7/day.
# At 26 the job would overspend by ~70 units a month and re-enter exactly the
# starved state this change exists to end — a limit set from the headline
# number while the monitoring quietly ate the difference. 23 + 1 probe + 2
# freshness probes = 26 units/day = 780 per 30 days, inside 800 with margin.
#
# WHY A BIGGER NUMBER IS NOT FASTER, WHICH IS THE POINT. Under a daily cap an
# overshoot cost nothing: it bounced that day and tomorrow started clean. Under
# a ROLLING window an overshoot borrows from the next 29 days. The 100 set here
# on 2026-10-04 drained the allowance and then produced NOTHING for days —
# strictly worse than 26 would have done. There is no burst to exploit; the
# average is the cap.
#
# It also broke the job silently. The reworded stub matched neither the quota
# marker nor the logged-out marker, so the startup session probe read it as a
# DEAD COOKIE, exited 1 nightly, and opened an issue telling a human to rotate
# a session that was perfectly healthy. Fixed in build-company-overview.mjs and
# check-freshness.py; this limit is the other half of that fix.
#
# If the backlog must move faster than 26/day, the lever is NOT this number.
# It is build-overview-from-filing.mjs — annual reports are free and unmetered
# and reach 1,572 of the 2,238 symbols still missing (measured 2026-10-06).
#
# WHY DAILY, AND WHAT IT SPENDS
#
# Each symbol costs one Haiku call, so this job spends money unattended. That
# was the reason it briefly ran manual-only, and the reason it does not any
# more: measured on the 24 Sep run, 78 symbols cost roughly 2,000 input and
# 300 output tokens each, which at Haiku 4.5 pricing is about $0.28 a run and
# well under $10 for the whole 2,335-symbol backfill. Supervision is not worth
# that. The budget is enforced instead by issuing ANTHROPIC_API_KEY inside a
# spend-capped Anthropic workspace, so the cap holds whether or not anyone is
# watching. A cap enforces; eyes do not.
#
# And manual was the more expensive risk. app.company_overview sat at 178 of
# 2,591 rows precisely BECAUSE this was the one ingest with no schedule — run
# by hand, twice, alphabetically. At 80 a run the backfill needs ~30 runs. Any
# process that needs a human to remember it 30 times stalls part way through
# the alphabet, which is the CLAUDE.md section 5 failure in its purest form,
# and it already happened here once. At 23 a run, Screener alone needs ~97 runs
# to drain the 2,238-symbol backlog — which is the argument for the filings
# path, not for a bigger number here.
#
# The queue does not care about cadence: app.company_overview_attempt
# .retry_after means a run resumes wherever the last one stopped, whether that
# was yesterday or a month ago. A missed night costs a day, nothing else. Once
# drained, a run settles into near-zero work and near-zero spend.
#
# EXIT CODES — READ THIS BEFORE "FIXING" A RED RUN
#
#   0  worked, or nothing was due (the steady state)
#   3  Screener's key-insights allowance ran out mid-run. NOT A FAILURE. The
#      rows built before the wall are good; the rest are still queued. The step
#      below translates 3 to success deliberately. NOTE: the cap is 800 per
#      ROLLING 30 days, so "run again tomorrow" only helps if usage from 30
#      days ago is aging out. Exit 3 is never a reason to rotate the session.
#   1  a real failure: session cookie dead or expired mid-run, or a crash.
#      Raises the GitHub issue below.
#
# Conflating 3 with 1 would mean a red run on every run of the backfill that
# hits the wall, and an alert nobody reads is the only kind that truly stops
# working.
#
# WHEN
#
# 19:00 UTC = 00:30 IST. Chosen when the quota was daily, to land just after
# an Indian-midnight reset. A ROLLING 30-day window has no reset, so that
# reason no longer applies and the time is now kept only for what still holds:
# it is clear of the 18:00 Saturday DQ check and the 22:00 announcements
# sweep. Left unchanged rather than silently re-justified.

name: Refresh Company Overviews

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Symbols to attempt (default 23; 800/30d minus probe cost)'
        required: false
        default: '23'

permissions:
  contents: read
  issues: write

concurrency:
  group: company-overview
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_DB_URL: ${{ secrets.NEON_APP_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FUNDAMENTAL_ALLOW_REMOTE_DB: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The script imports `postgres` and the Anthropic SDK from
      # web/node_modules rather than declaring its own dependencies, so the web
      # install is a hard prerequisite, not a convenience.
      - name: Install web deps
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build overviews
        id: build
        run: |
          set +e
          # 23, not 26: the session probes spend the same quota. See "WHY 23".
          #
          # The comment this replaces read: "the cost of overshooting is zero
          # and the cost of undershooting is a week of backlog." That was true
          # of a DAILY quota and is false of a rolling one — overshooting now
          # spends the next 29 days. Keeping the sentence here, struck through,
          # because the reasoning was sound and the premise was what moved.
          node scripts/build-company-overview.mjs --queue "${{ github.event.inputs.limit || 23 }}"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 3 == Screener key-insights quota reached. Expected while the
          # backfill runs; the work done before the wall is committed and good.
          # NOT a session problem and NOT a daily reset — see "WHY 26" above.
          if [ "$code" = "3" ]; then
            echo "Screener key-insights allowance reached (800 per rolling 30 days)."
            echo "Partial run, this is normal. Do NOT rotate the session for this."
            exit 0
          fi
          exit $code

      # The staleness sweep is a SEPARATE step so its failure is distinguishable
      # from the build's. It exits 1 when a stored overview quotes a fiscal year
      # more than one full year behind the last completed one, or when a newer
      # annual report supersedes a filing-sourced row. Reported, never fatal:
      # stale rows are a backlog to work through, not a broken pipeline.
      - name: Staleness sweep (report only)
        if: always() && steps.build.outputs.code != '1'
        continue-on-error: true
        run: node scripts/build-company-overview.mjs --audit

      - name: Raise a loud alert on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 Company-overview refresh FAILED"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf '%s\n' \
            "The company-overview worker did not complete cleanly at $(date -u '+%Y-%m-%d %H:%M UTC')." \
            "" \
            "Run: $RUN_URL" \
            "" \
            "**Check the quota BEFORE rotating anything.** On 2026-10-06 this alert fired" \
            "for four nights against a perfectly healthy cookie: Screener reworded its" \
            "quota stub, the marker stopped matching, and the session probe read a quota" \
            "wall as a dead session. Exit 3 is quota and never reaches this step — but a" \
            "stub we FAIL TO RECOGNISE arrives here as exit 1. If the run log shows no" \
            "Key Points for a symbol that previously had them, suspect the stub wording" \
            "first and compare it against QUOTA_MARKER in build-company-overview.mjs." \
            "" \
            "**Otherwise, most likely cause: the Screener session cookie has expired.**" \
            "" \
            "Screener does not return 401 for a dead session. It answers HTTP 200 with its" \
            "Register/Login page — measured at 20,236 bytes against 5,779 for a real wiki" \
            "fragment — which survives tag-stripping as valid-looking text. The script now" \
            "detects it by the presence of <html>/csrfmiddlewaretoken in what should be an" \
            "XHR fragment, probes the session BEFORE writing anything, and refuses to write" \
            "a zero-row overview under any circumstance. If this issue is open, all three" \
            "held and nothing was corrupted." \
            "" \
            "**Fix:** open https://equityroots.in/admin/screener and rotate the session. It logs in," \
            "proves the new cookie against the gated Key Points fragment, and writes" \
            "app.screener_session — the one copy this job reads. No repository secret is involved." \
            "" \
            "Note: exit code 3 (quota reached) is NOT a failure and does not reach" \
            "this step. If you are reading this, it was exit 1 or a crash.")
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
