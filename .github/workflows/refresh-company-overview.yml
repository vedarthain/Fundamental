# Daily company-overview backfill from ANNUAL REPORT FILINGS.
#
# WHAT REPLACED WHAT, AND WHY
#
#   Until 2026-10-13 this workflow ran scripts/build-company-overview.mjs, which
#   read Screener's gated Key Points wiki fragment. That source is metered at
#   800 requests per ROLLING 30 days — roughly 23 symbols a day once the session
#   probes take their share — and against a 2,238-symbol backlog it needed about
#   97 clean days. It did not get them: the allowance was exhausted, and every
#   freshness run since reported cookie_health red for a reason no rotation
#   could fix.
#
#   scripts/build-overview-from-filing.mjs reads the company's own annual report
#   PDF out of app.announcement instead. Free, unmetered, and first-party — the
#   company describing itself rather than a third party summarising it. On
#   2026-10-13 it moved overview coverage from 43.9% to 78.0% in a day, which is
#   more than the Screener path managed in its entire life.
#
#   Screener is NOT gone from this repo. It remains the source for
#   app.fundamentals_annual/quarterly, app.shareholding_pattern and
#   sector/industry classification. Only the overview fetch moved.
#
# WHY --missing 25 AND NOT MORE
#
#   The limit is no longer a quota, it is disk and wall time. Annual reports run
#   5-50MB; the script deletes each PDF as soon as its text is extracted (a
#   GitHub runner has ~14GB free and the earlier version kept them all until the
#   run ended, which died part way through with a disk error that looked nothing
#   like its cause). 25 symbols fits the 45-minute timeout with margin on a slow
#   NSE archive day. Raise it with workflow_dispatch if you want to burn through
#   the backlog faster; nothing breaks, the run just takes longer.
#
# WHY THIS NEEDS poppler-utils
#
#   The script shells out to `pdfinfo` and `pdftotext -layout`. They are not
#   preinstalled on ubuntu-latest. Without them every symbol fails identically
#   and the run reads as "no filings found", which is the wrong diagnosis.
#
# WHAT KEEPS THIS CURRENT (CLAUDE.md §5)
#
#   This workflow is that answer for app.company_overview. The backfill drains
#   on its own and the --stale sweep rebuilds rows whose fiscal year has fallen
#   behind, so coverage does not freeze at whatever the manual backfill reached.

name: Refresh Company Overviews

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Symbols to attempt (default 25)'
        required: false
        default: '25'

permissions:
  contents: read
  issues: write

concurrency:
  group: company-overview
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_DB_URL: ${{ secrets.NEON_APP_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FUNDAMENTAL_ALLOW_REMOTE_DB: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pdftotext / pdfinfo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # The script imports `postgres` and the Anthropic SDK from web/node_modules
      # rather than declaring its own dependencies, so the web install is a hard
      # prerequisite, not a convenience.
      - name: Install web deps
        working-directory: web
        run: npm ci --no-audit --no-fund

      # NOTE: no --cli here. That flag authenticates through the local Claude
      # Code CLI session and cannot work on a runner; the API-key path is the
      # only one available, and the script already refuses to start without a
      # key when --cli is absent.
      - name: Build overviews from filings
        id: build
        run: node scripts/build-overview-from-filing.mjs --missing "${{ github.event.inputs.limit || 25 }}" --apply

      # Separate step so its failure is distinguishable from the build's. Stale
      # rows are a backlog to work through, not a broken pipeline.
      - name: Rebuild stale overviews (report only)
        if: always() && steps.build.outcome != 'failure'
        continue-on-error: true
        run: node scripts/build-overview-from-filing.mjs --stale --apply

      - name: Raise a loud alert on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 Company-overview refresh FAILED"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf '%s\n' \
            "The company-overview worker did not complete cleanly at $(date -u '+%Y-%m-%d %H:%M UTC')." \
            "" \
            "Run: $RUN_URL" \
            "" \
            "This job no longer touches Screener. **Do not rotate the Screener session for this alert** — that was the fix for the old Key Points worker, retired on 2026-10-13, and it will do nothing here." \
            "" \
            "Likely causes, in order:" \
            "- poppler-utils missing or pdftotext failing: every symbol fails identically and the log reads like 'no filings found'." \
            "- No annual-report candidates in app.announcement for the queued symbols. Run scripts/fetch-nse-annual-reports.py and scripts/fetch-announcements.py first." \
            "- Disk exhaustion from a very large report. The script deletes each PDF after extraction; if this recurs, lower the --missing count." \
            "- ANTHROPIC_API_KEY missing or rejected." \
            "" \
            "Nothing is corrupted by a failed run: writes are committed per symbol and app.company_overview_attempt makes a re-run resume rather than restart.")
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
