# Corporate actions — Official Exchange Pipeline from BSE (100% Free).
#
# Primary corporate actions engine:
#   - Ingests dividends, splits, bonus issues, rights, and buybacks directly from BSE's official API
#   - 100% FREE with zero external subscription costs (replaces paid indianapi.in)
#   - Runs twice weekly (Tue & Fri 10:47 IST) to keep newly declared actions up-to-date
#
# Cadence: Tue + Fri 05:17 UTC = 10:47 IST. Off-the-hour to dodge GitHub's
# top-of-hour scheduler contention. ON CONFLICT makes every run idempotent.
#
# Required secret: NEON_APP_URL. (BSE needs no API key.)

name: Refresh Corporate Actions (Exchange Feed)

on:
  schedule:
    - cron: '17 5 * * 2,5'   # Tue & Fri, 05:17 UTC = 10:47 IST
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    # ~1,630 mapped symbols at ~0.4s throttle + latency ≈ 25–35 min; 55 margin.
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install psycopg
        run: pip install 'psycopg[binary]==3.2.*'

      - name: Fetch dividends from BSE
        env:
          APP_DB_URL:       ${{ secrets.NEON_APP_URL }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/fetch-corporate-actions.py
