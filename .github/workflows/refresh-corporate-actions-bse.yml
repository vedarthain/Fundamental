# Corporate actions — Official Exchange Pipeline from BSE (100% Free).
# Runs on the Droplet via SSH with direct VPC access to Postgres.

name: Refresh Corporate Actions (Exchange Feed)

on:
  # Automated runs migrated to native server cron (/var/www/Fundamental/scripts/cron-refresh-corp-actions-bse.sh).
  # workflow_dispatch is preserved for manual runs on demand.
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Run BSE Corporate Actions Fetch on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 55m
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main

            for env_path in web/.env.production web/.env.local web/.env .env.production .env.local .env; do
              if [ -f "$env_path" ] && grep -q "APP_DB_URL" "$env_path"; then
                set -a
                # shellcheck disable=SC1090
                . "$env_path"
                set +a
                break
              fi
            done

            export PYTHONUNBUFFERED=1
            /var/www/Fundamental/.venv/bin/python scripts/fetch-corporate-actions.py
