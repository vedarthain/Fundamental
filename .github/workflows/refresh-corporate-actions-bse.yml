# Corporate actions — Official Exchange Pipeline from BSE (100% Free).
#
# Primary corporate actions engine:
#   - Ingests dividends, splits, bonus issues, rights, and buybacks directly from BSE's official API
#   - 100% FREE with zero external subscription costs (replaces paid indianapi.in)
#   - Runs twice weekly (Tue & Fri 10:47 IST) on the Droplet via SSH
#
# Cadence: Tue + Fri 05:17 UTC = 10:47 IST. Off-the-hour to dodge GitHub's
# top-of-hour scheduler contention. ON CONFLICT makes every run idempotent.

name: Refresh Corporate Actions (Exchange Feed)

on:
  schedule:
    - cron: '17 5 * * 2,5'   # Tue & Fri, 05:17 UTC = 10:47 IST
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Run BSE Corporate Actions Fetch on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main

            # Ensure psycopg is available
            python3 -m pip install -q 'psycopg[binary]==3.2.*' 2>/dev/null || pip install -q 'psycopg[binary]==3.2.*' || true

            # Export production DB environment
            if [ -f web/.env.production ]; then
              set -a
              # Export APP_DB_URL, GOLDEN_DB_URL, and related envs
              eval "$(grep -E '^(APP_DB_URL|GOLDEN_DB_URL|UPSTOX_ANALYTICS_TOKEN)=' web/.env.production)"
              set +a
            fi

            export PYTHONUNBUFFERED=1
            python3 scripts/fetch-corporate-actions.py
