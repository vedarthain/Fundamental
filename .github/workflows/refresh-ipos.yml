# Daily IPO calendar + post-listing price refresh for app.ipo.
# Runs on the Droplet via SSH with direct VPC access to Postgres.

name: Refresh IPOs

on:
  schedule:
    - cron: '45 12 * * *'
  workflow_dispatch:
    inputs:
      listed_details:
        description: 'Also pull /ipos/{id} for already-listed rows'
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run IPO Refresh on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main

            /var/www/Fundamental/.venv/bin/pip install -q 'psycopg[binary]==3.2.*' 'requests'

            for env_path in web/.env.production web/.env.local web/.env .env.production .env.local .env; do
              if [ -f "$env_path" ] && grep -q "APP_DB_URL" "$env_path"; then
                set -a
                # shellcheck disable=SC1090
                . "$env_path"
                set +a
                break
              fi
            done

            export PYTHONUNBUFFERED=1

            EXTRA_ARG=""
            if [ "${{ github.event.inputs.listed_details }}" = "true" ]; then
              EXTRA_ARG="--listed-details"
            fi

            echo "=== Refreshing IPO Calendar & Prices ==="
            /var/www/Fundamental/.venv/bin/python scripts/fetch-ipos.py $EXTRA_ARG || true
