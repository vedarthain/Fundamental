# End-of-day data pipeline. Runs every weekday after market close on the Droplet.
#
# Pipeline:
#   1. refresh-ltp.py          NSE bhavcopy → screener_meta.current_price,
#                              market_cap_cr recompute, cluster_stocks_panel_cache
#                              refresh, golden.price_history OHLC insert.
#   2. fetch-indices.py        NSE indices CSV → app.market_index_history
#   3. fetch-fii-dii.py        NSE FII/DII JSON → app.fii_dii_flow
#   4. /api/revalidate         Purges Next.js Data Cache directly on the droplet

name: Refresh LTP + OHLC

on:
  schedule:
    # 13:00 UTC = 18:30 IST. Mon-Fri only.
    - cron: '0 13 * * 1-5'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run EOD Bhavcopy & Market Data Pipeline on Droplet
        uses: appleboy/ssh-action@v1.0.3
        env:
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          envs: REVALIDATE_TOKEN
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main

            for env_path in web/.env.production web/.env.local web/.env .env.production .env.local .env; do
              if [ -f "$env_path" ] && grep -q "APP_DB_URL" "$env_path"; then
                set -a
                # shellcheck disable=SC1090
                . "$env_path"
                set +a
                break
              fi
            done

            export PYTHONUNBUFFERED=1

            echo "=== 1. Refreshing LTP + OHLC from Bhavcopy ==="
            /var/www/Fundamental/.venv/bin/python scripts/refresh-ltp.py

            echo "=== 2. Refreshing NSE Indices ==="
            /var/www/Fundamental/.venv/bin/python scripts/fetch-indices.py || true

            echo "=== 3. Refreshing FII / DII Flows ==="
            /var/www/Fundamental/.venv/bin/python scripts/fetch-fii-dii.py || true

            echo "=== 4. Purging Local Next.js Cache ==="
            curl -s -X POST "http://localhost:3000/api/revalidate?token=$REVALIDATE_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"tags":["market","panel-cache","snapshot","sectors"]}' || true
            echo "EOD Pipeline completed successfully."
