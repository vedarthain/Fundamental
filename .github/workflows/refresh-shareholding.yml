# Quarterly shareholding-pattern refresh (promoter / FII / DII / pledge %).
# Runs on the Droplet via SSH with direct VPC access to Postgres.

name: Refresh shareholding pattern

on:
  schedule:
    - cron: '0 6 3 * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Run Shareholding Pattern Refresh on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main

            /var/www/Fundamental/.venv/bin/pip install -q 'psycopg[binary]==3.2.*' openpyxl
            /var/www/Fundamental/.venv/bin/pip install -q -e ./etl

            for env_path in web/.env.production web/.env.local web/.env .env.production .env.local .env; do
              if [ -f "$env_path" ] && grep -q "APP_DB_URL" "$env_path"; then
                set -a
                # shellcheck disable=SC1090
                . "$env_path"
                set +a
                break
              fi
            done

            export FUNDAMENTAL_ALLOW_REMOTE_DB="1"
            export PYTHONUNBUFFERED=1
            /var/www/Fundamental/.venv/bin/python -m fundamental_etl.cli fetch-shareholding --refresh
