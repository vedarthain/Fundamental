# Quarterly shareholding-pattern refresh (promoter / FII / DII / pledge %).
# Runs on the Droplet via SSH with direct VPC access to Postgres.

name: Refresh shareholding pattern

on:
  schedule:
    - cron: '0 6 3 * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Run Shareholding Pattern Refresh on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main

            python3 -m pip install -q -e ./etl 2>/dev/null || pip install -q -e ./etl || true

            if [ -f web/.env.production ]; then
              set -a
              eval "$(grep -E '^(APP_DB_URL|GOLDEN_DB_URL)=' web/.env.production)"
              set +a
            fi

            export FUNDAMENTAL_ALLOW_REMOTE_DB="1"
            export PYTHONUNBUFFERED=1
            python3 -m fundamental_etl.cli fetch-shareholding --refresh
