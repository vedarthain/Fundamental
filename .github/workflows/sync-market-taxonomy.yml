# Market Taxonomy Sync — AMFI Cap Tiers & NSE Index Constituents
# Runs on the Droplet via SSH with direct VPC access to Postgres.

name: Sync market taxonomy (AMFI & Indices)

on:
  schedule:
    # Semi-annual: 1st of January and 1st of July at 05:00 UTC = 10:30 IST
    - cron: '0 5 1 1,7 *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run Market Taxonomy Sync on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main

            python3 -m pip install -q 'psycopg[binary]==3.2.*' 'openpyxl==3.1.*' 2>/dev/null || pip install -q 'psycopg[binary]==3.2.*' 'openpyxl==3.1.*' || true

            if [ -f web/.env.production ]; then
              set -a
              eval "$(grep -E '^(APP_DB_URL|GOLDEN_DB_URL)=' web/.env.production)"
              set +a
            fi

            export PYTHONUNBUFFERED=1

            echo "=== 1. Refreshing AMFI market-cap tiers ==="
            python3 scripts/fetch-amfi-categorization.py

            echo "=== 2. Refreshing NSE index constituents ==="
            python3 scripts/fetch-index-constituents.py
