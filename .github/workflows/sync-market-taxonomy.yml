# Market Taxonomy Sync — AMFI Cap Tiers & NSE Index Constituents
#
# Combines:
#   1. AMFI Market-Cap Tier Categorisation (Large, Mid, Small Cap) from AMFI
#   2. NSE Index Constituent Membership (Nifty 50, 100, 200, 500, Midcap, Smallcap)
#
# Cadence:
#   Both AMFI and NSE rebalance twice a year (Jan/Jul and Mar/Sep).
#   Runs semi-annually on Jan 1 & Jul 1, or on-demand via workflow_dispatch.
#
# Required secret:
#   NEON_APP_URL — Postgres URL for fundamental_app

name: Sync market taxonomy (AMFI & Indices)

on:
  schedule:
    # Semi-annual: 1st of January and 1st of July at 05:00 UTC = 10:30 IST
    - cron: '0 5 1 1,7 *'
  workflow_dispatch: {}

concurrency:
  group: sync-market-taxonomy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install 'psycopg[binary]==3.2.*' 'openpyxl==3.1.*'

      - name: Refresh AMFI market-cap tiers
        env:
          APP_DB_URL: ${{ secrets.NEON_APP_URL }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/fetch-amfi-categorization.py

      - name: Refresh NSE index constituents
        env:
          APP_DB_URL: ${{ secrets.NEON_APP_URL }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/fetch-index-constituents.py
