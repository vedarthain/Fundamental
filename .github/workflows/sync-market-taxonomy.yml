# Market Taxonomy Sync — AMFI Cap Tiers & NSE Index Constituents
# Runs on the Droplet via SSH with direct VPC access to Postgres.

name: Sync market taxonomy (AMFI & Indices)

on:
  schedule:
    # Semi-annual: 1st of January and 1st of July at 05:00 UTC = 10:30 IST
    - cron: '0 5 1 1,7 *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run Market Taxonomy Sync on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main

            /var/www/Fundamental/.venv/bin/pip install -q 'psycopg[binary]==3.2.*' 'openpyxl==3.1.*'

            for env_path in web/.env.production web/.env.local web/.env .env.production .env.local .env; do
              if [ -f "$env_path" ] && grep -q "APP_DB_URL" "$env_path"; then
                set -a
                # shellcheck disable=SC1090
                . "$env_path"
                set +a
                break
              fi
            done

            export PYTHONUNBUFFERED=1

            echo "=== 1. Refreshing AMFI market-cap tiers ==="
            /var/www/Fundamental/.venv/bin/python scripts/fetch-amfi-categorization.py

            echo "=== 2. Refreshing NSE index constituents ==="
            /var/www/Fundamental/.venv/bin/python scripts/fetch-index-constituents.py
