# Daily Upstox instrument-master sync.
# Runs on the Droplet via SSH with direct VPC connection to Postgres.

name: Sync Upstox instruments

on:
  schedule:
    - cron: '30 1 * * 1-5'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run Upstox Instrument Sync on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main

            # Setup isolated Python virtual environment on droplet if not present
            if [ ! -d "/var/www/Fundamental/.venv" ]; then
              apt-get update -y && apt-get install -y python3-venv python3-pip
              python3 -m venv /var/www/Fundamental/.venv
            fi

            /var/www/Fundamental/.venv/bin/pip install -q 'psycopg[binary]==3.2.*' 'requests'

            if [ -f web/.env.production ]; then
              set -a
              eval "$(grep -E '^(APP_DB_URL|GOLDEN_DB_URL)=' web/.env.production)"
              set +a
            fi

            export PYTHONUNBUFFERED=1
            /var/www/Fundamental/.venv/bin/python scripts/fetch-upstox-instruments.py
