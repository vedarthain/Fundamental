# Daily Upstox instrument-master sync.
# Runs on the Droplet via SSH with direct VPC connection to Postgres.

name: Sync Upstox instruments

on:
  schedule:
    - cron: '30 1 * * 1-5'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run Upstox Instrument Sync on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main

            python3 -m pip install -q 'psycopg[binary]==3.2.*' 2>/dev/null || pip install -q 'psycopg[binary]==3.2.*' || true

            if [ -f web/.env.production ]; then
              set -a
              eval "$(grep -E '^(APP_DB_URL|GOLDEN_DB_URL)=' web/.env.production)"
              set +a
            fi

            export PYTHONUNBUFFERED=1
            python3 scripts/fetch-upstox-instruments.py
