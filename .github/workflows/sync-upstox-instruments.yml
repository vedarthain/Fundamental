# Daily Upstox instrument-master sync.
# Runs on the Droplet via SSH with direct VPC connection to Postgres.

name: Sync Upstox instruments

on:
  schedule:
    - cron: '30 1 * * 1-5'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run Upstox Instrument Sync on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main

            # Load environment from whatever .env file has APP_DB_URL
            for env_path in web/.env.production web/.env.local web/.env .env.production .env.local .env; do
              if [ -f "$env_path" ] && grep -q "APP_DB_URL" "$env_path"; then
                echo "Loading environment from $env_path"
                set -a
                # shellcheck disable=SC1090
                . "$env_path"
                set +a
                break
              fi
            done

            echo "APP_DB_URL is set: $([ -n "$APP_DB_URL" ] && echo 'YES' || echo 'NO')"

            export PYTHONUNBUFFERED=1
            /var/www/Fundamental/.venv/bin/python scripts/fetch-upstox-instruments.py
