# Weekly CALLS & AUDIT — part 2 of weekly pipeline (Saturday: Compute, Sunday: Calls & Audit).
# Runs on the Droplet via SSH with direct VPC access to Postgres.

name: Sunday Calls & Portfolio Audit

on:
  schedule:
    # Sun 13:30 UTC = 19:00 IST (7:00 PM IST Sunday evening).
    - cron: '30 13 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview calls without writing updates)'
        required: false
        type: boolean
        default: false

concurrency:
  group: weekly-calls
  cancel-in-progress: false

jobs:
  audit-and-calls:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run Sunday Calls and Portfolio Audit on Droplet
        uses: appleboy/ssh-action@v1.0.3
        env:
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          envs: REVALIDATE_TOKEN
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main

            /var/www/Fundamental/.venv/bin/pip install -q 'psycopg[binary]==3.2.*' numpy scipy
            /var/www/Fundamental/.venv/bin/pip install -q -e ./etl

            for env_path in web/.env.production web/.env.local web/.env .env.production .env.local .env; do
              if [ -f "$env_path" ] && grep -q "APP_DB_URL" "$env_path"; then
                set -a
                # shellcheck disable=SC1090
                . "$env_path"
                set +a
                break
              fi
            done

            export FUNDAMENTAL_ALLOW_REMOTE_DB="1"
            export PYTHONUNBUFFERED=1

            DRY_ARG=""
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              DRY_ARG="--dry-run"
            fi

            echo "=== 1. Computing institutional target prices & accumulation zones ==="
            /var/www/Fundamental/.venv/bin/python scripts/backfill_target_prices.py $DRY_ARG

            echo "=== 2. Running cluster calls & portfolio sweep audit ==="
            /var/www/Fundamental/.venv/bin/python scripts/audit_cluster_calls.py

            echo "=== 3. Purging Local Next.js Cache ==="
            curl -s -X POST "http://localhost:3000/api/revalidate?token=$REVALIDATE_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"tags":["market","panel-cache","snapshot","sectors","calls"]}' || true
            echo "Sunday Calls & Audit pipeline completed successfully."
