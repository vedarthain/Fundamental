# Weekly CALLS & AUDIT — part 2 of weekly pipeline (Saturday: Compute, Sunday: Calls & Audit).
# Runs on the Droplet via SSH with direct VPC access to Postgres.

name: Sunday Calls & Portfolio Audit

on:
  # Scheduled run has been decommissioned from GitHub Actions to prevent queue delays.
  # Automated runs trigger at 2:00:00 PM IST sharp via native Droplet cron (/var/www/Fundamental/scripts/cron-sunday-calls.sh).
  # workflow_dispatch is preserved for manual runs on demand.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview calls without writing updates)'
        required: false
        type: boolean
        default: false

concurrency:
  group: weekly-calls
  cancel-in-progress: false

jobs:
  audit-and-calls:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run Sunday Calls and Portfolio Audit on Droplet
        uses: appleboy/ssh-action@v1.0.3
        env:
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 60m
          envs: REVALIDATE_TOKEN,GEMINI_API_KEY
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main

            /var/www/Fundamental/.venv/bin/pip install -q 'psycopg[binary]==3.2.*' numpy scipy
            /var/www/Fundamental/.venv/bin/pip install -q -e ./etl

            for env_path in web/.env.production web/.env.local web/.env .env.production .env.local .env; do
              if [ -f "$env_path" ] && grep -q "APP_DB_URL" "$env_path"; then
                set -a
                # shellcheck disable=SC1090
                . "$env_path"
                set +a
                break
              fi
            done

            export FUNDAMENTAL_ALLOW_REMOTE_DB="1"
            export PYTHONUNBUFFERED=1

            DRY_ARG=""
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              DRY_ARG="--dry-run"
            fi

            echo "=== 1. Computing institutional target prices & accumulation zones ==="
            /var/www/Fundamental/.venv/bin/python scripts/backfill_target_prices.py $DRY_ARG

            echo "=== 2. Running cluster calls & portfolio sweep audit ==="
            /var/www/Fundamental/.venv/bin/python scripts/audit_cluster_calls.py

            echo "=== 3. Generating Gemini verdicts for weekly new calls & portfolio holdings ==="
            if [ -z "$DRY_ARG" ] && [ -n "${GEMINI_API_KEY:-}" ]; then
              /var/www/Fundamental/.venv/bin/python scripts/ollama-verdict.py \
                --weekly-new-portfolio --engine gemini --load --workers 3 --delay 1.0
            else
              echo "Skipping Gemini weekly verdict pass (dry-run or GEMINI_API_KEY not set)."
            fi

            echo "=== 4. Purging Local Next.js Cache ==="
            curl -s -X POST "http://localhost:3000/api/revalidate?token=$REVALIDATE_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"tags":["market","panel-cache","snapshot","sectors","calls"]}' || true
            echo "Sunday Calls & Audit pipeline completed successfully."
