# Weekly COMPUTE — part 2 of 2 (fetch → compute).
#
# The deterministic half: reads the fundamentals + raw blobs that weekly-fetch.yml
# wrote, recomputes metrics + scores, rebuilds the /market dashboard cache, and
# purges the CDN. No Screener scraping — so it never depends on the cookies and
# can be re-run any time to re-score on existing data (the old `skip_fetch=true`
# path, now its own workflow).
#
# Pipeline (each step depends on the previous):
#   1. compute-metrics       metrics_snapshot from fundamentals + golden prices
#                            + the raw blobs (market cap for the valuation pillar)
#   2. score                 percentile + composite → app.scores +
#                            cluster_stocks_panel_cache for the snapshot_date
#   3. build-market-snapshot rebuild app.market_snapshot_cache for /market
#   4. /api/revalidate       purge Vercel's Data Cache for the changed tags
#
# Trigger: CHAINED to weekly-fetch.yml via `workflow_run` — this runs the moment
# the fetch workflow COMPLETES SUCCESSFULLY (Sat, once the ≤180-min scrape ends),
# and is SKIPPED if fetch failed. "Success" here is precise: the fetch job exits
# non-zero ONLY on Screener cookie expiry (auth_failed>0, cli.py). A throttled or
# partial scrape still exits 0 → still counts as success → compute still runs, so
# a slow week doesn't block scoring (fundamentals are quarterly; a partial scrape
# scores fine). Only a dead-cookie fetch (no fresh blobs) gates compute out.
# After a manual fetch re-run (e.g. post cookie-rotation), its success re-triggers
# this automatically; workflow_dispatch below still allows a standalone re-run.
#
# Required secrets:
#   NEON_APP_URL        — fundamental_app on Neon
#   NEON_GOLDEN_URL     — golden_db on Neon
#   REVALIDATE_TOKEN    — bearer for the /api/revalidate cache purge
#   (No SCREENER_* needed — config.py defaults them to "", and only the scraper
#    enforces their presence; these steps don't scrape.)

name: Weekly Compute + Score

on:
  # Run ONLY after weekly-fetch finishes. The job-level `if` below then gates on
  # conclusion == 'success', so a failed fetch (cookie expiry) skips compute.
  workflow_run:
    workflows: ["Weekly Fetch (Screener)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: 'YYYY-MM-DD to snapshot (default: today UTC)'
        required: false

# Never run two compute/score passes at once — a manual run and the scheduled
# run writing the same snapshot_date would race on app.scores. cancel-in-progress
# =false protects the in-flight pass (it's mid-write); a second trigger queues.
concurrency:
  group: weekly-compute
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  compute:
    runs-on: ubuntu-latest
    # Skip when the triggering fetch failed/was cancelled. Manual dispatch always
    # runs (no upstream run attached). This is THE dependency gate: no successful
    # fetch → no compute+score.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # compute ~45 + score ~15 + rebuild ~3 on a warm Neon. But a cold/throttled
    # Sunday run has pushed compute-metrics to ~75-80 min, which blew the old
    # 90-min cap and got the build/revalidate steps canceled mid-run (scores had
    # already saved). 150 absorbs a cold-Neon worst case with margin to spare.
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fundamental-etl
        run: pip install -e ./etl

      # compute-metrics reads the fresh blobs (from weekly-fetch), so valuation
      # populates correctly. No SCREENER_* needed — this path never scrapes.
      - name: Compute metrics + score
        env:
          APP_DB_URL:           ${{ secrets.NEON_APP_URL }}
          GOLDEN_DB_URL:        ${{ secrets.NEON_GOLDEN_URL }}
          PYTHONUNBUFFERED:     "1"
        run: |
          SNAP_ARG=""
          if [ -n "${{ github.event.inputs.snapshot_date }}" ]; then
            SNAP_ARG="--snapshot ${{ github.event.inputs.snapshot_date }}"
          fi
          python -m fundamental_etl.cli compute-metrics $SNAP_ARG
          python -m fundamental_etl.cli score $SNAP_ARG

      - name: Rebuild /market snapshot cache
        env:
          APP_DB_URL:    ${{ secrets.NEON_APP_URL }}
          GOLDEN_DB_URL: ${{ secrets.NEON_GOLDEN_URL }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/build-market-snapshot.py

      # Purge the CDN so users see the new snapshot. Fail loudly on non-200.
      - name: Purge Next.js Data Cache
        run: |
          set +e
          RESPONSE_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST "https://equityroots.in/api/revalidate" \
            -H "Authorization: Bearer ${{ secrets.REVALIDATE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"tags":["market","panel-cache","snapshot","sectors"]}')
          echo "HTTP status: $HTTP_CODE"
          echo "Response body:"
          cat "$RESPONSE_FILE"
          echo
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Cache purge failed (HTTP $HTTP_CODE) — check REVALIDATE_TOKEN secret matches Vercel."
            exit 1
          fi
