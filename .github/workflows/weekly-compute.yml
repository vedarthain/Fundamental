# Weekly COMPUTE — part 2 of 2 (fetch → compute).
# Runs on the Droplet via SSH with direct VPC access to Postgres.

name: Weekly Compute + Score

on:
  schedule:
    # Sat 03:00 UTC = 08:30 IST.
    - cron: '0 3 * * 6'
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: 'YYYY-MM-DD to snapshot (default: today UTC)'
        required: false
      skip_coverage_gate:
        description: 'Score even if fetch coverage is below the floor'
        required: false
        type: boolean
        default: false

concurrency:
  group: weekly-compute
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Run Weekly Compute & Scoring on Droplet
        uses: appleboy/ssh-action@v1.0.3
        env:
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          envs: REVALIDATE_TOKEN
          script: |
            set -e
            cd /var/www/Fundamental
            git pull origin main

            /var/www/Fundamental/.venv/bin/pip install -q 'psycopg[binary]==3.2.*' numpy scipy openpyxl
            /var/www/Fundamental/.venv/bin/pip install -q -e ./etl

            for env_path in web/.env.production web/.env.local web/.env .env.production .env.local .env; do
              if [ -f "$env_path" ] && grep -q "APP_DB_URL" "$env_path"; then
                set -a
                # shellcheck disable=SC1090
                . "$env_path"
                set +a
                break
              fi
            done

            export FUNDAMENTAL_ALLOW_REMOTE_DB="1"
            export PYTHONUNBUFFERED=1

            # 1. Gate on fetch coverage
            if [ "${{ github.event.inputs.skip_coverage_gate }}" != "true" ]; then
              echo "=== Checking fetch coverage ==="
              /var/www/Fundamental/.venv/bin/python scripts/check-fetch-coverage.py --within-days 10 --min-pct 95
            fi

            # 2. Compute metrics + score
            SNAP_ARG=""
            if [ -n "${{ github.event.inputs.snapshot_date }}" ]; then
              SNAP_ARG="--snapshot ${{ github.event.inputs.snapshot_date }}"
            fi

            echo "=== Assigning clusters ==="
            /var/www/Fundamental/.venv/bin/python -m fundamental_etl.cli assign-clusters

            echo "=== Computing metrics ==="
            /var/www/Fundamental/.venv/bin/python -m fundamental_etl.cli compute-metrics $SNAP_ARG

            echo "=== Scoring universe ==="
            /var/www/Fundamental/.venv/bin/python -m fundamental_etl.cli score $SNAP_ARG

            echo "=== Re-rendering evidence sheets ==="
            /var/www/Fundamental/.venv/bin/python scripts/evidence-sheet-rebuild.py || true

            echo "=== Rebuilding market snapshot cache ==="
            /var/www/Fundamental/.venv/bin/python scripts/build-market-snapshot.py || true

            echo "=== Purging Local Next.js Cache ==="
            curl -s -X POST "http://localhost:3000/api/revalidate?token=$REVALIDATE_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"tags":["market","panel-cache","snapshot","sectors"]}' || true
            echo "Weekly compute completed successfully."
