[project]
name = "fundamental-etl"
version = "0.1.0"
description = "ETL + scoring engine for the NSE Equity Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "typer>=0.12",
    "tenacity>=9.0",
    # Imported at module scope by officers.py and business_info.py. It was
    # missing here while being present in the local venv, so every local run
    # worked and refresh-company-info.yml — which installs this package and
    # nothing else — died on ModuleNotFoundError at its monthly fire (#11).
    "yfinance>=0.2",
]

[project.scripts]
etl = "fundamental_etl.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
